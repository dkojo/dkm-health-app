# CD: runs when a reviewed PR is merged to main.
# build -> scan -> push to registry (artifact repo) -> sign -> [human approval] -> verify -> deploy -> smoke test -> DAST
name: cd

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false # never interrupt a deploy midway

env:
  IMAGE_NAME: dkm-health-app
  REGISTRY: ${{ vars.ACR_NAME }}.azurecr.io
  TRIVY_IMAGE: aquasec/trivy:0.58.1
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ vars.AZURE_CD_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

jobs:
  # 6. RELEASE ARTIFACT: build once, scan, push to ACR, sign + attach SBOM
  release:
    # Skip (not fail) until Azure is bootstrapped and the repo variables are set (README Steps 2-3).
    # deploy and dast depend on this job, so they skip too.
    if: vars.AZURE_CD_CLIENT_ID != '' && vars.ACR_NAME != '' && vars.TFSTATE_ACCOUNT != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Azure login + keyless Cosign signing
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CD_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: az acr login --name "${{ vars.ACR_NAME }}"
      - name: Build
        run: docker build -t "$REGISTRY/$IMAGE_NAME:${{ github.sha }}" .
      - name: Image scan gate (Trivy)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image \
            --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed "$REGISTRY/$IMAGE_NAME:${{ github.sha }}"
      - name: SBOM (CycloneDX)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/out" "$TRIVY_IMAGE" image \
            --format cyclonedx --output /out/sbom.cdx.json "$REGISTRY/$IMAGE_NAME:${{ github.sha }}"
      - name: Push
        id: push
        run: |
          docker push "$REGISTRY/$IMAGE_NAME:${{ github.sha }}"
          echo "image=$(docker inspect --format='{{index .RepoDigests 0}}' "$REGISTRY/$IMAGE_NAME:${{ github.sha }}")" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@v3
      - name: Sign image and attach SBOM attestation (keyless, GitHub OIDC)
        run: |
          cosign sign --yes "${{ steps.push.outputs.image }}"
          cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "${{ steps.push.outputs.image }}"
      - uses: actions/upload-artifact@v7
        with: { name: sbom, path: sbom.cdx.json, retention-days: 90 }

  # 7. DEPLOY to production: waits for a required reviewer on the "production" environment
  deploy:
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.tf.outputs.url }}
    permissions:
      contents: read
      id-token: write
    outputs:
      url: ${{ steps.tf.outputs.url }}
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CD_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: az acr login --name "${{ vars.ACR_NAME }}"
      - uses: sigstore/cosign-installer@v3
      - name: Verify signature (only images signed by this repo's CD workflow on main may deploy)
        run: |
          cosign verify "${{ needs.release.outputs.image }}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/cd.yml@refs/heads/main" \
            > /dev/null
      - uses: hashicorp/setup-terraform@v4
        with: { terraform_version: 1.12.0, terraform_wrapper: false }
      - name: Terraform plan + apply
        id: tf
        working-directory: infra
        run: |
          terraform init -input=false -backend-config="storage_account_name=${{ vars.TFSTATE_ACCOUNT }}"
          terraform plan -input=false -out=tfplan \
            -var "acr_name=${{ vars.ACR_NAME }}" -var "image=${{ needs.release.outputs.image }}"
          terraform apply -input=false tfplan
          echo "url=$(terraform output -raw app_url)" >> "$GITHUB_OUTPUT"
      - name: Smoke test
        run: |
          for path in /health /ready; do
            curl --fail --silent --show-error --retry 10 --retry-delay 15 --retry-all-errors \
              "${{ steps.tf.outputs.url }}$path"; echo
          done

  # 8. DAST: OWASP ZAP baseline against the live app (report only; triage findings into the backlog)
  dast:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: ZAP baseline scan
        run: |
          mkdir -p zap && chmod 777 zap
          docker run --rm -v "$PWD/zap:/zap/wrk" ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t "${{ needs.deploy.outputs.url }}" -r zap-report.html -I
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: zap-report, path: zap/zap-report.html, retention-days: 90 }
