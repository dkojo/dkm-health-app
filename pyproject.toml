[project]
name = "dkm-health-app"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: errors, I: imports, UP: modern syntax, B: bugbear, S: bandit security rules
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"] # asserts and dummy passwords are fine in tests

[tool.pytest.ini_options]
testpaths = ["tests"]
