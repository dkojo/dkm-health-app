# Checkov config = the IaC risk register for the PRODUCTION profile.
# Every skip is a documented, time-boxed risk acceptance (SOC2 CC3.2 / CC9.1).
# Remove a line when its backlog item ships; the pipeline then enforces the check.
# Used by: the plan policy gate (CI plan job / CD deploy) when profile=production.
compact: true
quiet: true
