# Checkov config = the IaC risk register for the PRODUCTION profile.
# Every skip is a documented, time-boxed risk acceptance (SOC2 CC3.2 / CC9.1).
# Remove a line when its backlog item ships; the pipeline then enforces the check.
# Used by: the plan policy gate (CI plan job / CD deploy) when profile=production.
compact: true
quiet: true
skip-check:
  # --- Accepted by design ---
  - CKV2_AZURE_1   # CMK: platform-managed keys + infrastructure (double) encryption; revisit if a customer contract requires CMK
  - CKV_AZURE_33   # queue service logging: no queues are used
  # --- False positive ---
  - CKV2_AZURE_21  # blob read logging IS enabled via azurerm_monitor_diagnostic_setting.blob (Checkov looks for classic logging)
