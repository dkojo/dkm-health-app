<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 660" width="1280" height="660" role="img" aria-labelledby="t d">
  <title id="t">dkm-health-app identity and trust flow</title>
  <desc id="d">Animated OIDC flow: GitHub Actions jobs request a short-lived OIDC token, which Microsoft Entra ID exchanges only when the token subject matches a federated credential. Pull requests get the read-only CI identity; main-branch and production-environment jobs get the CD identity. Tokens from any other repository are rejected.</desc>
  <defs>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#0d1530"/>
    </linearGradient>
    <path id="pci"  d="M290,170 C330,170 330,290 360,290 H580 C615,290 615,195 650,195 H980"/>
    <path id="pmain" d="M290,310 H580 C615,310 615,405 650,405 H980"/>
    <path id="penv" d="M290,450 C330,450 330,330 360,330 H580 C615,330 615,405 650,405 H980"/>
    <path id="pbad" d="M290,575 C420,575 520,575 632,575"/>
  </defs>
  <style>
    .t  { font: 600 15px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #e2e8f0; }
    .s  { font: 400 12px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #94a3b8; }
    .m  { font: 400 11px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #94a3b8; }
    .k  { font: 700 11px ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: .08em; }
    .h  { font: 700 24px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #f8fafc; }
    .wire { fill: none; stroke: #23314f; stroke-width: 2; }
    .flow { fill: none; stroke-width: 2; stroke-dasharray: 6 10; }
    .node { fill: #111a30; stroke-width: 1.5; }
  </style>

  <rect width="1280" height="660" fill="url(#bg)"/>
  <text x="32" y="46" class="h">dkm-health-app · identity &amp; trust</text>
  <text x="32" y="68" class="s">GitHub never holds an Azure secret. Each job swaps a short-lived OIDC token for exactly the access its trigger allows.</text>
  <g transform="translate(1150,30)">
    <rect width="98" height="28" rx="14" fill="#0f2a22" stroke="#34d399" stroke-opacity=".6"/>
    <circle cx="18" cy="14" r="5" fill="#34d399"><animate attributeName="opacity" values="1;.25;1" dur="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="18" cy="14" r="5" fill="none" stroke="#34d399">
      <animate attributeName="r" values="5;12" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".8;0" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="32" y="19" class="k" fill="#34d399">LIVE FLOW</text>
  </g>

  <text x="40" y="112" class="k" fill="#60a5fa">GITHUB ACTIONS JOB</text>
  <text x="360" y="230" class="k" fill="#94a3b8">TOKEN ISSUER</text>
  <text x="650" y="112" class="k" fill="#fbbf24">ENTRA FEDERATED CREDENTIAL</text>
  <text x="980" y="112" class="k" fill="#34d399">AZURE ACCESS GRANTED</text>

  <g class="wire"><use xlink:href="#pci"/><use xlink:href="#pmain"/><use xlink:href="#penv"/><use xlink:href="#pbad"/></g>
  <g class="flow">
    <use xlink:href="#pci" stroke="#22d3ee"/><use xlink:href="#pmain" stroke="#a78bfa"/><use xlink:href="#penv" stroke="#a78bfa"/>
    <use xlink:href="#pbad" stroke="#f87171"/>
    <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1s" repeatCount="indefinite"/>
  </g>

  <g filter="url(#glow)">
    <circle r="6" fill="#22d3ee"><animateMotion dur="4.5s" repeatCount="indefinite"><mpath xlink:href="#pci"/></animateMotion></circle>
    <circle r="6" fill="#22d3ee"><animateMotion dur="4.5s" begin="2.25s" repeatCount="indefinite"><mpath xlink:href="#pci"/></animateMotion></circle>
    <circle r="6" fill="#a78bfa"><animateMotion dur="4.5s" begin=".7s" repeatCount="indefinite"><mpath xlink:href="#pmain"/></animateMotion></circle>
    <circle r="6" fill="#a78bfa"><animateMotion dur="4.5s" begin="1.6s" repeatCount="indefinite"><mpath xlink:href="#penv"/></animateMotion></circle>
    <circle r="6" fill="#f87171">
      <animateMotion dur="2.5s" repeatCount="indefinite"><mpath xlink:href="#pbad"/></animateMotion>
      <animate attributeName="opacity" values="1;1;0" keyTimes="0;.9;1" dur="2.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- jobs -->
  <rect x="40" y="130" width="250" height="80" rx="12" class="node" stroke="#22d3ee"/>
  <text x="56" y="160" class="t">pull_request</text>
  <text x="56" y="181" class="s">ci.yml · plan job</text>
  <text x="56" y="197" class="s">needs read-only access</text>

  <rect x="40" y="270" width="250" height="80" rx="12" class="node" stroke="#a78bfa"/>
  <text x="56" y="300" class="t">push to main</text>
  <text x="56" y="321" class="s">cd.yml · release job</text>
  <text x="56" y="337" class="s">push + sign the image</text>

  <rect x="40" y="410" width="250" height="80" rx="12" class="node" stroke="#a78bfa"/>
  <text x="56" y="440" class="t">environment: production</text>
  <text x="56" y="461" class="s">cd.yml · deploy job</text>
  <text x="56" y="477" class="s">only after reviewer approval</text>

  <rect x="40" y="535" width="250" height="80" rx="12" class="node" stroke="#f87171" stroke-dasharray="5 5"/>
  <text x="56" y="565" class="t">Any other repo</text>
  <text x="56" y="586" class="s">fork, look-alike, or a repo</text>
  <text x="56" y="602" class="s">recreated under the same name</text>

  <!-- issuer -->
  <rect x="360" y="250" width="220" height="120" rx="12" class="node" stroke="#94a3b8"/>
  <text x="376" y="280" class="t">GitHub OIDC</text>
  <text x="376" y="301" class="m">token.actions.</text>
  <text x="376" y="316" class="m">githubusercontent.com</text>
  <text x="376" y="340" class="s">signed JWT, valid minutes</text>
  <text x="376" y="356" class="s">subject = repo + trigger</text>

  <!-- federated credentials -->
  <rect x="650" y="140" width="260" height="110" rx="12" class="node" stroke="#22d3ee"/>
  <text x="666" y="170" class="t">dkm-health-github-ci</text>
  <text x="666" y="192" class="s">trusts only:</text>
  <text x="666" y="210" class="m">repo:&lt;ids&gt;:pull_request</text>
  <text x="666" y="232" class="s">immutable owner/repo IDs</text>

  <rect x="650" y="330" width="260" height="150" rx="12" class="node" stroke="#a78bfa"/>
  <text x="666" y="360" class="t">dkm-health-github-cd</text>
  <text x="666" y="382" class="s">trusts only:</text>
  <text x="666" y="400" class="m">repo:&lt;ids&gt;:ref:refs/heads/main</text>
  <text x="666" y="418" class="m">repo:&lt;ids&gt;:environment:production</text>
  <text x="666" y="444" class="s">immutable owner/repo IDs</text>

  <!-- rejection -->
  <g transform="translate(650,560)">
    <rect width="260" height="34" rx="10" fill="#2a1114" stroke="#f87171" stroke-opacity=".7"/>
    <text x="14" y="22" class="k" fill="#f87171">✕ NO MATCHING SUBJECT: DENIED</text>
    <rect width="260" height="34" rx="10" fill="none" stroke="#f87171" stroke-width="2">
      <animate attributeName="stroke-opacity" values="0;0;1;0" keyTimes="0;.85;.92;1" dur="2.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- access -->
  <rect x="980" y="125" width="270" height="160" rx="12" class="node" stroke="#22d3ee"/>
  <text x="996" y="155" class="t">Read-only</text>
  <text x="996" y="178" class="s">Reader · app + shared RGs</text>
  <text x="996" y="196" class="s">Blob Data Reader · tfstate</text>
  <text x="996" y="214" class="s">Container App plan reader</text>
  <text x="996" y="232" class="s">(listSecrets only, custom role)</text>
  <text x="996" y="262" class="k" fill="#34d399">NO WRITE ACCESS</text>

  <rect x="980" y="325" width="270" height="190" rx="12" class="node" stroke="#a78bfa"/>
  <text x="996" y="355" class="t">Deploy</text>
  <text x="996" y="378" class="s">Contributor · app RG</text>
  <text x="996" y="396" class="s">RBAC Admin · app RG + ACR</text>
  <text x="996" y="414" class="s">AcrPush · registry</text>
  <text x="996" y="432" class="s">Blob Data Contributor · tfstate</text>
  <text x="996" y="450" class="s">Reader · shared RG</text>
  <text x="996" y="490" class="k" fill="#fbbf24">SCOPED TO THIS APP ONLY</text>
</svg>
